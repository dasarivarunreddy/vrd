name: Sync Medium posts
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-medium.mjs
        env:
          MEDIUM_USER: YOUR_MEDIUM_USERNAME   # <-- change this, without the @
      - name: Commit if changed
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog-posts.json
          git diff --staged --quiet || (git commit -m "Sync Medium posts" && git push)
